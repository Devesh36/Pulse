# Hot reload without publishing the gateway or broadening host port bindings.
services:
  api:
    command: [/bin/sh, -c, "uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5"]
    volumes:
      - ./packages:/app/packages:ro
      - ./apps/api:/app/apps/api:ro
  web:
    build:
      context: apps/web
      target: build
    command: [npx, next, dev, --hostname, 0.0.0.0]
    volumes:
      - ./apps/web/src:/app/src:ro
