name: pulse-lab
x-backend: &backend
  image: pulse-lab-backend
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
x-proxy: &proxy
  NO_PROXY: localhost,127.0.0.1,api,gateway,postgres,prometheus,demo-api,demo-worker
  no_proxy: localhost,127.0.0.1,api,gateway,postgres,prometheus,demo-api,demo-worker
x-demo: &demo
  image: pulse-lab-demo
  build: ./services
  networks: [control]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 0.5
  restart: "no"
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 2s
    timeout: 3s
    retries: 2
    start_period: 3s
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_DB: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pulse lab up}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [control]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pulse -d pulse]
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    <<: *backend
    user: "0:0"
    command: [/app/.venv/bin/uvicorn, apps.api.gateway:app, --host, 0.0.0.0, --port, "8001", --workers, "1"]
    environment:
      <<: *proxy
      PULSE_ADAPTER_TOKEN: ${PULSE_ADAPTER_TOKEN:?Run pulse lab up}
      PULSE_RESOURCE_PROJECT: pulse-lab
      PULSE_GATEWAY_JOURNAL: /gateway-data/gateway.db
      PULSE_LAB_TOKEN: ${PULSE_LAB_TOKEN:?Run pulse lab up}
      PULSE_LAB_ENABLED: "true"
    volumes: [/var/run/docker.sock:/var/run/docker.sock, gateway-data:/gateway-data]
    networks: [control]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
  api:
    <<: *backend
    environment:
      <<: *proxy
      PULSE_DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse
      PULSE_ADMIN_TOKEN: ${PULSE_ADMIN_TOKEN:?Run pulse lab up}
      PULSE_ADAPTER_TOKEN: ${PULSE_ADAPTER_TOKEN:?Run pulse lab up}
      PULSE_ADAPTER_URL: http://gateway:8001
      PULSE_PROMETHEUS_URL: http://prometheus:9090
      PULSE_WEB_ORIGIN: http://localhost:3100
      PULSE_LAB_ENABLED: "true"
      PULSE_LAB_PROJECT: pulse-lab
      PULSE_LAB_TEST_TOKEN: ${PULSE_LAB_TEST_TOKEN:?Run pulse lab up}
      PULSE_LLM_MODEL: ${PULSE_LLM_MODEL:-}
      PULSE_LLM_API_KEY: ${PULSE_LLM_API_KEY:-}
      PULSE_LLM_API_BASE: ${PULSE_LLM_API_BASE:-}
      PULSE_PROBE_URLS: '{"demo-api":"http://demo-api:8080/health","demo-worker":"http://demo-worker:8080/health"}'
      PULSE_PROBE_ALLOWED_HOSTS: '["demo-api","demo-worker"]'
    ports: [127.0.0.1:8100:8000]
    networks: [control, localports]
    depends_on:
      postgres: {condition: service_healthy}
      gateway: {condition: service_started}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.5
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    ports: [127.0.0.1:8109:9090]
    networks: [control, localports]
    mem_limit: 256m
    cpus: 0.5
  demo-api:
    <<: *demo
    environment:
      <<: *proxy
      LAB_SERVICE: demo-api
      PULSE_LAB_ENABLED: "true"
      PULSE_LAB_TOKEN: ${PULSE_LAB_TOKEN:?Run pulse lab up}
    labels:
      pulse.monitor: "true"
      pulse.remediate: "true"
      pulse.environment: development
      pulse.lab: pulse-lab
    volumes: [api-fault-state:/data]
  demo-worker:
    <<: *demo
    environment:
      <<: *proxy
      LAB_SERVICE: demo-worker
      PULSE_LAB_ENABLED: "true"
      PULSE_LAB_TOKEN: ${PULSE_LAB_TOKEN:?Run pulse lab up}
    labels:
      pulse.monitor: "true"
      pulse.remediate: "true"
      pulse.environment: development
      pulse.lab: pulse-lab
    volumes: [worker-fault-state:/data]
  web:
    profiles: [dashboard]
    build: ../../apps/web
    environment:
      <<: *proxy
      PULSE_API_URL: http://api:8000
    ports: [127.0.0.1:3100:3000]
    networks: [localports]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
volumes:
  postgres-data:
  gateway-data:
  prometheus-data:
  api-fault-state:
  worker-fault-state:
networks:
  control: {internal: true}
  localports: {}
