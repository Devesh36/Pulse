[project]
name = "pulse-sre"
version = "0.2.0"
description = "Evidence-driven local AI SRE with human-approved recovery"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "docker>=7.1,<8", "langgraph>=1.0,<2", "litellm>=1.60,<2",
  "prometheus-client>=0.21,<1"
]
[project.scripts]
pulse = "pulse.cli:main"
Pulse = "pulse.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["packages/pulse", "apps"]
exclude = ["apps/web/**"]
[tool.hatch.build.hooks.custom]
path = "scripts/build-hook.py"
[tool.hatch.build.targets.sdist]
only-include = ["packages/pulse", "apps", "examples/incident-lab", "scripts/build-hook.py", "pyproject.toml", "uv.lock", "alembic.ini", ".dockerignore", "README.md", "LICENSE"]
exclude = ["examples/incident-lab/reports/**", "**/node_modules/**", "**/.next/**", "**/__pycache__/**", "**/.env", "**/*.tsbuildinfo"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
