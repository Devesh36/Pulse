name: Fast CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest -q --ignore=tests/test_integrations.py
      - run: npm ci --prefix apps/web && npm run format:check --prefix apps/web && npm run typecheck --prefix apps/web && npm run build --prefix apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Compose and migration validation
        run: |
          uv run --no-sync python scripts/setup-env.py
          docker compose --profile demo config --quiet
          uv run --no-sync python -c "from pulse.lab.cli import compose; compose('config', '--quiet', dashboard=True)"
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
          uv run --no-sync alembic downgrade base
          uv run --no-sync alembic upgrade head
        env:
          PULSE_DATABASE_URL: sqlite:///./ci-migrations.db
